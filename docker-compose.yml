version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GOOGLE_GENAI_API_KEY: ${GOOGLE_GENAI_API_KEY:-}
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - GOOGLE_GENAI_API_KEY=${GOOGLE_GENAI_API_KEY}
    restart: always